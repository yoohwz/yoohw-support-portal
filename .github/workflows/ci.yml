name: YSP CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Repository and safety contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Repository contracts
        run: python3 tests/repository-contract-tests.py

      - name: Source safety characterizations
        run: python3 tests/source-safety-contract-tests.py

      - name: Stage exact distribution payload
        shell: bash
        run: bash scripts/stage-distribution.sh . "$RUNNER_TEMP/staged/yoohw-support-portal"

      - name: Diff whitespace
        shell: bash
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"

  php-modern:
    name: PHP 8.2 syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Check PHP syntax
        shell: bash
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l

  javascript:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Check JavaScript syntax
        shell: bash
        run: find assets/js -name '*.js' -print0 | xargs -0 -r -n1 node --check

  php-floor:
    name: PHP 7.4 support floor
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up PHP 7.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '7.4'
          coverage: none

      - name: Check PHP 7.4 syntax
        shell: bash
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l

  plugin-check:
    name: WordPress Plugin Check
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Stage exact WordPress.org payload
        shell: bash
        run: bash scripts/stage-distribution.sh . "$RUNNER_TEMP/staged/yoohw-support-portal"

      - name: Run WordPress Plugin Check
        uses: wordpress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: ${{ runner.temp }}/staged/yoohw-support-portal
          slug: yoohw-support-portal
          strict: false

  gate:
    name: ${{ github.event.pull_request.draft == false && 'YSP Required CI' || 'Iteration Gate' }}
    if: ${{ always() }}
    needs:
      - contracts
      - php-modern
      - javascript
      - php-floor
      - plugin-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require applicable validation jobs
        env:
          DRAFT: ${{ github.event.pull_request.draft }}
          CONTRACTS: ${{ needs.contracts.result }}
          PHP_MODERN: ${{ needs.php-modern.result }}
          JAVASCRIPT: ${{ needs.javascript.result }}
          PHP_FLOOR: ${{ needs.php-floor.result }}
          PLUGIN_CHECK: ${{ needs.plugin-check.result }}
        shell: bash
        run: |
          set -euo pipefail

          require_success() {
            local name="$1"
            local result="$2"
            if [[ "$result" != "success" ]]; then
              echo "$name must succeed; got $result" >&2
              exit 1
            fi
          }

          require_skipped() {
            local name="$1"
            local result="$2"
            if [[ "$result" != "skipped" ]]; then
              echo "$name must be skipped in draft mode; got $result" >&2
              exit 1
            fi
          }

          require_success contracts "$CONTRACTS"
          require_success php-modern "$PHP_MODERN"
          require_success javascript "$JAVASCRIPT"

          if [[ "$DRAFT" == "true" ]]; then
            require_skipped php-floor "$PHP_FLOOR"
            require_skipped plugin-check "$PLUGIN_CHECK"
            echo "iteration-gate-ok"
          else
            require_success php-floor "$PHP_FLOOR"
            require_success plugin-check "$PLUGIN_CHECK"
            echo "ysp-required-ci-ok"
          fi
